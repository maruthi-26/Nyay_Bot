services:
  # ── 1. NyayBot Backend (FastAPI Python Service) ──────────────────────────
  - type: web
    name: nyaybot-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: BHASHINI_API_KEY
        sync: false
      - key: BHASHINI_USER_ID
        sync: false
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: nyaybot-frontend
          envVarKey: RENDER_EXTERNAL_HOSTNAME

  # ── 2. NyayBot Frontend (Next.js Node.js Service) ────────────────────────
  - type: web
    name: nyaybot-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: nyaybot-backend
          envVarKey: RENDER_EXTERNAL_HOSTNAME